<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>甜品店小帮工</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff0f5;
      color: #333;
      background: url('../images/ground17.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #cd4875;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .header p {
      font-size: 1.2em;
      color: #981d46;
    }

    .game-container {
      background: #f5f5dc;
      background-image: url('../images/ground16.png');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      border-radius: 20px;
      padding: 60px 40px 40px;
      box-shadow: 0 4px 20px rgba(255, 102, 153, 0.3);
      margin-bottom: 30px;
      text-align: center;
      min-height: 700px;
      border: 2px solid #ffccdd;
    }

    .game-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      margin-top: 20px;
      margin-left: 20px;
      margin-right: 20px;
      padding: 5px;
      background-color: #fff8e6;
      border-radius: 15px;
      border: 2px dashed #f4dd9b;
    }

    .info-item {
      text-align: center;
    }

    .info-item h3 {
      color: #7f5c4d;
      margin-bottom: 5px;
      font-size: 1em;
    }

    .info-item p {
      font-size: 1.1em;
      font-weight: bold;
      color: #7f5c4d;
    }

    .display-area {
      background-color: #fff8e6;
      border-radius: 15px;
      padding: 45px;
      margin-bottom: 30px;
      margin-left: 25px;
      margin-right: 25px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #f4dd9b;
    }

    .display-text {
      font-size: 36px;
      font-weight: bold;
      color: rgb(200, 77, 64);
    }

    .input-area {
      margin-bottom: 30px;
    }

    input[type='text'] {
      width: 80%;
      padding: 15px;
      font-size: 18px;
      border: 3px solid #f4dd9b;
      border-radius: 20px;
      text-align: center;
      background-color: #fff8e6;
      outline: none;
      caret-color: #ff6699;
      text-shadow: 0 0 0 #ff6699;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }

    .difficulty-select {
      margin: 40px 0 20px;
      text-align: center;
    }

    .difficulty-btn {
      margin: 0 10px;
    }

    .difficulty-btn.active {
      background-color: #85362c;
      transform: scale(1.05);
    }

    .game-controls {
      margin-top: 20px;
      text-align: center;
    }

    #dessert-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .dessert-btn {
      background-color: rgb(200, 77, 64);
      color: white;
      border: 3px solid rgb(160, 60, 50);
      border-radius: 20px;
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 100px;
    }

    .dessert-btn:hover {
      background-color: rgb(180, 67, 54);
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(200, 77, 64, 0.4);
    }

    .dessert-btn:active {
      background-color: #f4dd9b;
      color: rgb(200, 77, 64);
      transform: scale(0.95);
      box-shadow: 0 2px 5px rgba(244, 221, 155, 0.4);
    }

    .btn {
      background-color: rgb(200, 77, 64);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
      margin: 0 10px;
      box-shadow: 0 4px 10px rgba(255, 102, 153, 0.3);
    }

    .btn:hover {
      background-color: #f4de9b;
      transform: scale(1.05);
    }

    .btn-secondary {
      background-color: #ffccdd;
      color: #ff6699;
    }

    .btn-secondary:hover {
      background-color: #ffb3cc;
    }

    .instructions {
      background-color: rgba(255, 245, 248, 0.9);
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      margin-bottom: 30px;
      width: 150%;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      border: none;
      text-align: center;
    }

    .instructions p {
      margin-bottom: 10px;
      line-height: 1.4;
      font-size: 1.1em;
    }

    .footer {
      text-align: center;
      color: #9d0034;
      font-size: 1.1em;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 可爱的返回按钮 -->
    <div style="position: absolute; top: 20px; left: 20px; z-index: 1000">
      <button onclick="window.location.href = '../child-home.html'" style="
            background: linear-gradient(135deg, #ff6699, #ff99cc);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 153, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 2s ease-in-out infinite alternate;
          " onmouseover="this.style.transform = 'scale(1.1) rotate(10deg)'"
        onmouseout="this.style.transform = 'scale(1) rotate(0deg)'">
        ←
      </button>
    </div>

    <div class="header">
      <h1>甜品店小帮工</h1>
      <div class="instructions">
        <p>欢迎来到彩虹甜品店！</p>
        <p>店长阿姨记性不太好，每次听到小朋友点单，都要倒着重复一遍才能记牢。</p>
        <p>你要来当最厉害的小帮工，认真听完一串点单内容，然后从最后一个往前说。</p>
      </div>
    </div>

    <div class="game-container">
      <div class="difficulty-select">
        <button class="btn difficulty-btn" data-level="easy">简单</button>
        <button class="btn difficulty-btn" data-level="medium">中等</button>
        <button class="btn difficulty-btn" data-level="hard">困难</button>
      </div>

      <div class="game-info">
        <div class="info-item">
          <h3>关卡</h3>
          <p id="level">0</p>
        </div>
        <div class="info-item">
          <h3>甜品勋章</h3>
          <p id="score">0</p>
        </div>
        <div class="info-item">
          <h3>错误次数</h3>
          <p id="errors">0</p>
        </div>
        <div class="info-item">
          <h3>时间</h3>
          <p id="time">0</p>
        </div>
      </div>

      <div class="display-area">
        <div class="display-text" id="displayText"></div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="" disabled />
        <div id="dessert-buttons" style="display: none"></div>
      </div>

      <div class="game-controls">
        <button class="btn" id="startBtn">开始工作</button>
        <button class="btn" id="submitBtn" disabled style="display: none">提交订单</button>
      </div>
    </div>

    <div class="footer">
      <p>© 2026 注意力训练平台 - 彩虹甜品店</p>
    </div>
  </div>

  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes cosmosBloom {
      0% {
        transform: scale(0.8) translateY(40px);
        opacity: 0;
      }

      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    @keyframes revealUp {
      0% {
        transform: translateY(12px);
        opacity: 0;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sprinkle-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .sprinkle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: sprinkleBounce 1.5s ease-in-out infinite;
    }

    .sprinkle-dot:nth-child(1) {
      background: #ffb3ba;
      animation-delay: 0s;
    }

    .sprinkle-dot:nth-child(2) {
      background: #ffd54f;
      animation-delay: 0.2s;
    }

    .sprinkle-dot:nth-child(3) {
      background: #a5d6a7;
      animation-delay: 0.4s;
    }

    .sprinkle-dot:nth-child(4) {
      background: #90caf9;
      animation-delay: 0.6s;
    }

    .sprinkle-dot:nth-child(5) {
      background: #ce93d8;
      animation-delay: 0.8s;
    }

    .sprinkle-dot:nth-child(6) {
      background: #ffcc80;
      animation-delay: 1s;
    }

    .sprinkle-dot:nth-child(7) {
      background: #ef9a9a;
      animation-delay: 1.2s;
    }

    @keyframes sprinkleBounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.6;
      }

      50% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }
  </style>

  <script src="../floating-ball.js"></script>
  <script src="../api/vision-uploader.js"></script>
  <script src="../utils.js"></script>
  <script>
    // 游戏变量
    let score = 0;
    let level = 1;
    let time = 30;
    let errors = 0;
    let gameState = 'ready'; // ready, displaying, input, gameOver
    let currentSequence = [];
    let timeInterval;
    let currentDifficulty = 'easy'; // 默认难度
    let isWordRound = false; // 是否为词汇回合
    let userSelection = []; // 用户选择的甜品
    let round = 0; // 当前训练轮数
    const maxRounds = 5; // 每轮训练的最大轮数

    // [scoring-system] Session created in startGame() so vision data
    // covers the full gameplay period, not just the end-of-game API window.
    let gameSessionId = null;

    // 游戏配置
    const config = {
      sequenceLength: 3,
      displayTime: 2000,
      inputTime: 5000,
    };

    // 难度配置
    const difficultySettings = {
      easy: 3,
      medium: 5,
      hard: 7,
    };

    // 甜品词汇库
    const wordList = [
      '蛋糕',
      '布丁',
      '奶茶',
      '冰淇淋',
      '饼干',
      '巧克力',
      '糖果',
      '果冻',
      '水果',
      '马卡龙',
      '甜甜圈',
      '奶昔',
      '华夫饼',
      '泡芙',
      '蛋挞',
    ];

    // 初始化游戏
    function initGame() {
      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('submitBtn').addEventListener('click', checkAnswer);
      document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          checkAnswer();
        }
      });

      // 难度选择按钮事件
      const difficultyBtns = document.querySelectorAll('.difficulty-btn');
      difficultyBtns.forEach((btn) => {
        btn.addEventListener('click', function () {
          // 移除所有按钮的active类
          difficultyBtns.forEach((b) => b.classList.remove('active'));
          // 添加当前按钮的active类
          this.classList.add('active');
          // 设置当前难度
          currentDifficulty = this.getAttribute('data-level');
          // 更新序列长度
          config.sequenceLength = difficultySettings[currentDifficulty];
        });
      });

      // 默认选中简单难度
      document.querySelector('[data-level="easy"]').classList.add('active');
    }

    // 开始游戏
    function startGame() {
      if (gameState === 'ready' || gameState === 'gameOver') {
        score = 0;
        level = 1;
        time = 30;
        errors = 0;
        round = 0;
        gameState = 'displaying';

        // 确保使用当前选择的难度对应的序列长度
        config.sequenceLength = difficultySettings[currentDifficulty];

        // 调整按钮显示
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'inline-block';

        updateUI();
        generateSequence();
        displaySequence();

        // 开始计时
        timeInterval = setInterval(() => {
          time--;
          updateUI();
          if (time <= 0) {
            endGame();
          }
        }, 1000);

        // [scoring-system] Create training session at game start so that
        // vision data captured during gameplay is associated with this session.
        const _isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const _baseUrl = _isLocal ? 'http://localhost:5000' : window.location.origin;
        const _userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
        const _childId =
          (typeof UserStateUtil !== 'undefined' ? UserStateUtil.getCurrentChildId() : null) ||
          _userInfo?.currentChildId ||
          1;

        fetch(`${_baseUrl}/api/training/session/start`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
          },
          body: JSON.stringify({
            child_id: _childId,
            game_type: 'reverse-memory',
            device_id: 'web',
          }),
        })
          .then((r) => r.json())
          .then((res) => {
            if (res.success) {
              gameSessionId = res.data.session_id;
              if (typeof visionUploader !== 'undefined') {
                visionUploader.start(gameSessionId);
              }
            }
          })
          .catch((err) => {
            console.warn('Failed to create session at game start:', err);
          });
      }
    }

    function generateSequence() {
      currentSequence = [];
      isWordRound = Math.random() > 0.5;

      for (let i = 0; i < config.sequenceLength; i++) {
        if (isWordRound) {
          const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
          currentSequence.push(randomWord);
        } else {
          const randomNumber = Math.floor(Math.random() * 10);
          currentSequence.push(randomNumber.toString());
        }
      }
    }

    function displaySequence() {
      document.getElementById('userInput').value = '';

      const displayText = document.getElementById('displayText');
      displayText.textContent = currentSequence.join(' ');

      document.getElementById('userInput').disabled = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('dessert-buttons').style.display = 'none';

      setTimeout(() => {
        displayText.textContent = isWordRound ? '请按倒序点击甜品' : '请输入倒述的订单内容';
        gameState = 'input';
        userSelection = [];

        if (isWordRound) {
          document.getElementById('userInput').style.display = 'none';
          document.getElementById('dessert-buttons').style.display = 'flex';
          document.getElementById('submitBtn').disabled = true;
          createDessertButtons();
        } else {
          document.getElementById('userInput').style.display = 'block';
          document.getElementById('dessert-buttons').style.display = 'none';
          document.getElementById('userInput').disabled = false;
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('userInput').focus();
        }
      }, config.displayTime);
    }

    // 创建甜品按钮
    function createDessertButtons() {
      const container = document.getElementById('dessert-buttons');
      container.innerHTML = '';

      // 随机打乱序列顺序
      const shuffledSequence = [...currentSequence].sort(() => Math.random() - 0.5);

      shuffledSequence.forEach((dessert) => {
        const button = document.createElement('button');
        button.className = 'dessert-btn';
        button.textContent = dessert;
        button.addEventListener('click', function () {
          userSelection.push(dessert);
          this.style.backgroundColor = '#F4DD9B';
          this.style.color = 'rgb(200, 77, 64)';
          this.disabled = true;

          // 检查是否已经选择了所有甜品
          if (userSelection.length === currentSequence.length) {
            // 启用提交按钮
            document.getElementById('submitBtn').disabled = false;
          }
        });
        container.appendChild(button);
      });
    }

    // 检查答案
    function checkAnswer() {
      if (gameState === 'input') {
        let userInput;
        const correctAnswer = currentSequence.reverse();

        if (isWordRound) {
          // 词汇回合，使用用户点击的顺序
          userInput = userSelection;
        } else {
          const rawValue = document.getElementById('userInput').value.trim().replace(/\s+/g, '');
          userInput = rawValue.split('');
        }

        // 检查答案是否正确
        const isCorrect =
          userInput.length === correctAnswer.length &&
          userInput.every((item, index) => item === correctAnswer[index]);

        if (isCorrect) {
          score += 10;
          level++;
        } else {
          errors++;
        }

        // 增加轮数
        round++;

        // 检查是否完成所有轮数
        if (round < maxRounds) {
          config.sequenceLength = difficultySettings[currentDifficulty];
          gameState = 'displaying';
          generateSequence();
          displaySequence();
        } else {
          endGame();
        }
      }
    }

    function calculateWorkingMemoryScore() {
      const acc = score > 0 ? score / 10 / (level + errors) : 0;
      const timeOvertime = 30 - time;
      const speed = Math.max(0, 1 / (1 + timeOvertime / 45));
      const order = 1;

      // MediaPipe 指标（暂时使用默认值，后续可从实际数据获取）
      const headStable = 0.8; // 头部稳定性
      const blinkStable = 0.8; // 眨眼稳定性

      // 计算最终得分
      const scoreValue = (acc * 0.4 + order * 0.2 + speed * 0.2 + headStable * 0.12 + blinkStable * 0.08) * 100;

      return Math.max(0, Math.min(100, Math.round(scoreValue)));
    }

    function endGame() {
      gameState = 'gameOver';
      clearInterval(timeInterval);

      // 统计游戏使用时间
      try {
        if (typeof GameTimeUtil !== 'undefined') {
          GameTimeUtil.endGame('reverse-memory');
        }
      } catch (e) {
        console.log('GameTimeUtil 未定义，跳过');
      }

      if (typeof MedalUtil !== 'undefined') {
        MedalUtil.recordGameProgress('game7', currentDifficulty);
      }

      // 调整按钮显示
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('submitBtn').style.display = 'none';

      // 计算工作记忆得分
      const finalScore = calculateWorkingMemoryScore();

      // 保存游戏数据
      const gameData = {
        gameName: 'reverse-memory',
        score: finalScore,
        level: level,
        timestamp: new Date().toISOString(),
      };

      // 保存到本地存储
      try {
        if (typeof StorageUtil !== 'undefined') {
          const trainingHistory = StorageUtil.getItem('training_history') || [];
          trainingHistory.push(gameData);
          StorageUtil.setItem('training_history', trainingHistory);
        }
      } catch (e) {
        console.log('StorageUtil 未定义，跳过');
      }

      showGameOverModal(finalScore);
      uploadTrainingData();
    }

    function showGameOverModal(finalScore) {
      const elapsed = 30 - time;

      const scoreDetails = {
        time: {
          name: '用时',
          score: elapsed + 's',
          color: '#e65100',
        },
        level: {
          name: '完成关卡',
          score: level,
          color: '#2e7d32',
        },
        errors: {
          name: '错误次数',
          score: errors,
          color: '#c62828',
        },
      };

      const message = '你的评分为：' + finalScore + '分';

      const modal = document.createElement('div');
      modal.style.cssText = `
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(160, 60, 50, 0.25);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease both;
      `;

      const modalContent = document.createElement('div');
      modalContent.style.cssText = `
        background: linear-gradient(180deg, #FFF0F5 0%, #FFD6E0 100%);
        padding: 32px 36px 28px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 2px 16px rgba(200, 77, 64, 0.12);
        max-width: 420px;
        width: 90%;
        animation: cosmosBloom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        position: relative;
        overflow: hidden;
      `;

      const topGlow = document.createElement('div');
      topGlow.style.cssText = `
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 200px;
        background: radial-gradient(ellipse, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      `;
      modalContent.appendChild(topGlow);

      const starField = document.createElement('div');
      starField.style.cssText = `
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
      `;

      for (let i = 0; i < 10; i++) {
        const s = 1 + Math.random() * 1.5;
        const star = document.createElement('div');
        star.style.cssText = `
          position: absolute;
          width: ${s}px;
          height: ${s}px;
          background: #fff;
          border-radius: 50%;
          top: ${Math.random() * 100}%;
          left: ${Math.random() * 100}%;
          opacity: ${0.2 + Math.random() * 0.3};
          box-shadow: 0 0 ${s * 1.5}px rgba(255, 150, 130, 0.5);
        `;
        starField.appendChild(star);
      }

      const floatDecor = ['\u{1F36A}', '\u{1F369}', '\u{1F382}', '\u2728', '\u{1F495}'];
      for (let i = 0; i < 4; i++) {
        const deco = document.createElement('div');
        deco.textContent = floatDecor[i];
        deco.style.cssText = `
          position: absolute;
          font-size: ${16 + i * 4}px;
          top: ${10 + i * 18}%;
          ${i % 2 === 0 ? 'left' : 'right'}: ${-5 + i * 2}px;
          opacity: 0.2;
          pointer-events: none;
        `;
        starField.appendChild(deco);
      }

      modalContent.appendChild(starField);

      const modalTitle = document.createElement('h2');
      modalTitle.innerHTML = '\u{1F9C1} \u5DE5\u4F5C\u7ED3\u675F\uFF01 \u{1F9C1}';
      modalTitle.style.cssText = `
        color: #b3473a;
        font-size: 24px;
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
        animation: revealUp 0.45s 0.05s ease both;
      `;
      modalContent.appendChild(modalTitle);

      const scoreItems = Object.values(scoreDetails);
      const statsGrid = document.createElement('div');
      statsGrid.style.cssText = `
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 24px;
        position: relative;
        z-index: 1;
      `;

      scoreItems.forEach((detail, idx) => {
        const statItem = document.createElement('div');
        statItem.style.cssText = `
          background: rgba(255, 255, 255, 0.55);
          border-radius: 12px;
          padding: 12px 8px;
          animation: revealUp 0.4s ${0.12 + idx * 0.08}s ease both;
        `;

        const statLabel = document.createElement('div');
        statLabel.textContent = detail.name;
        statLabel.style.cssText = `
          color: ${detail.color};
          font-size: 11px;
          margin-bottom: 4px;
          font-weight: bold;
        `;
        statItem.appendChild(statLabel);

        const statValue = document.createElement('div');
        statValue.textContent = detail.score;
        statValue.style.cssText = `
          color: #b3473a;
          font-size: 22px;
          font-weight: bold;
        `;
        statItem.appendChild(statValue);

        statsGrid.appendChild(statItem);
      });

      modalContent.appendChild(statsGrid);

      const modalMessage = document.createElement('p');
      modalMessage.textContent = message;
      modalMessage.style.cssText = `
        color: #b3473a;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
        animation: revealUp 0.4s 0.3s ease both;
      `;
      modalContent.appendChild(modalMessage);

      const modalButtons = document.createElement('div');
      modalButtons.style.cssText = `
        display: flex;
        gap: 12px;
        justify-content: center;
        position: relative;
        z-index: 1;
        animation: revealUp 0.45s 0.36s ease both;
      `;

      const restartBtn = document.createElement('button');
      restartBtn.textContent = '\u518D\u73A9\u4E00\u6B21';
      restartBtn.style.cssText = `
        background: #d4695a;
        color: white;
        border: none;
        padding: 10px 26px;
        border-radius: 25px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      `;
      restartBtn.onmouseover = () => {
        restartBtn.style.transform = 'scale(1.05)';
        restartBtn.style.background = '#e0897c';
      };
      restartBtn.onmouseout = () => {
        restartBtn.style.transform = 'scale(1)';
        restartBtn.style.background = '#d4695a';
      };
      restartBtn.onclick = function () {
        document.body.removeChild(modal);
        startGame();
      };

      const backBtn = document.createElement('button');
      backBtn.textContent = '\u8FD4\u56DE';
      backBtn.style.cssText = `
        background: transparent;
        color: #b86e5c;
        border: 2px solid #f4c2c2;
        padding: 10px 26px;
        border-radius: 25px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      `;
      backBtn.onmouseover = () => {
        backBtn.style.background = 'rgba(255, 255, 255, 0.4)';
        backBtn.style.color = '#b3473a';
      };
      backBtn.onmouseout = () => {
        backBtn.style.background = 'transparent';
        backBtn.style.color = '#b86e5c';
      };
      backBtn.onclick = function () {
        document.body.removeChild(modal);
        gameState = 'ready';
        score = 0;
        level = 1;
        time = 30;
        errors = 0;
        round = 0;
        updateUI();
        document.getElementById('displayText').textContent = '';
        document.getElementById('userInput').value = '';
        document.getElementById('userInput').disabled = true;
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('dessert-buttons').style.display = 'none';
      };

      modalButtons.appendChild(restartBtn);
      modalButtons.appendChild(backBtn);

      modalContent.appendChild(modalButtons);

      const sprinkleRow = document.createElement('div');
      sprinkleRow.className = 'sprinkle-row';
      const sprinkleColors = ['#ffb3ba', '#ffd54f', '#a5d6a7', '#90caf9', '#ce93d8', '#ffcc80', '#ef9a9a'];
      for (let i = 0; i < 7; i++) {
        const dot = document.createElement('div');
        dot.className = 'sprinkle-dot';
        dot.style.cssText = `
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: ${sprinkleColors[i]};
          animation: sprinkleBounce 1.5s ease-in-out infinite;
          animation-delay: ${i * 0.2}s;
        `;
        sprinkleRow.appendChild(dot);
      }
      modalContent.appendChild(sprinkleRow);

      modal.appendChild(modalContent);
      document.body.appendChild(modal);
    }

    function uploadTrainingData() {
      try {
        // [scoring-system] Upload game data + end session.
        // Session was created in startGame(); use gameSessionId directly.
        const _uploadAndEnd = () => {
          const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
          const childId =
            typeof UserStateUtil !== 'undefined'
              ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
              : 1;

          // 计算工作记忆得分
          const finalScore = calculateWorkingMemoryScore();
          const accuracy = score > 0 ? (score / 10 / (level + errors)) * 100 : 0;

          // 检测环境，设置API地址
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

          if (typeof visionUploader !== 'undefined') {
            visionUploader.stop();
          }

          // 上传游戏数据
          fetch(`${baseUrl}/api/training/game-data`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
            },
            body: JSON.stringify({
              session_id: gameSessionId,
              request_id: Date.now().toString(),
              timestamp: new Date().toISOString(),
              event_type: 'game_complete',
              score: finalScore,
              accuracy: accuracy,
              level: level,
              time: time,
              correct: score,
              error: errors,
              total_target: level,
              total_step: level,
            }),
          })
            .then((response) => response.json())
            .then((result) => {
              if (result.success) {
                console.log('游戏数据上传成功');

                // 清除能力评估页面的缓存
                const cacheKey = `child_data_${childId}`;
                localStorage.removeItem(cacheKey);
                console.log('已清除能力评估缓存:', cacheKey);

                // 结束训练会话
                return fetch(`${baseUrl}/api/training/session/end`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
                  },
                  body: JSON.stringify({
                    session_id: gameSessionId,
                    final_score: finalScore,
                    total_accuracy: accuracy,
                    duration: time,
                  }),
                });
              } else {
                throw new Error(result.message || '上传游戏数据失败');
              }
            })
            .then((response) => response.json())
            .then((result) => {
              console.log('会话结束响应数据:', result);
              if (result.success) {
                console.log('训练数据上传完成');

                // 保存训练时间到 localStorage，用于今日训练页面显示
                const today = new Date().toISOString().split('T')[0];
                const trainingData = JSON.parse(localStorage.getItem('trainingData') || '{}');

                if (!trainingData[today]) {
                  trainingData[today] = { totalTime: 0 };
                }

                // 累加游戏时间（秒）
                trainingData[today].totalTime += time;
                localStorage.setItem('trainingData', JSON.stringify(trainingData));
                console.log('训练时间已保存到 localStorage');

                // 使用后端计算的综合评分（融合视觉数据 + 游戏权重 + 难度）
                var backendScore = null;
                var backendLevel = null;
                if (result.data && result.data.summary) {
                  backendScore = Math.round(result.data.summary.final_score);
                  backendLevel = result.data.summary.performance_level;
                }
              }
            })
            .catch((error) => {
              console.error('上传训练数据失败:', error);
            });
        };

        if (gameSessionId) {
          _uploadAndEnd();
        } else {
          // [scoring-system] Fallback: session not ready from startGame().
          console.warn('Session not ready from startGame, creating inline');
          const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
          const childId =
            typeof UserStateUtil !== 'undefined'
              ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
              : 1;
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

          fetch(`${baseUrl}/api/training/session/start`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
            },
            body: JSON.stringify({
              child_id: childId,
              game_type: 'reverse-memory',
              device_id: 'web',
            }),
          })
            .then((r) => r.json())
            .then((res) => {
              if (res.success) {
                gameSessionId = res.data.session_id;
                // 先上传缓冲的视觉数据，再提交游戏数据
                var flushDone = Promise.resolve();
                if (typeof visionUploader !== 'undefined') {
                  flushDone = visionUploader.start(gameSessionId) || Promise.resolve();
                }
                flushDone.then(function () {
                  _uploadAndEnd();
                });
              }
            });
        }
      } catch (e) {
        console.error('uploadTrainingData 错误:', e);
      }
    }

    function restartGame() {
      startGame();
    }

    function backToStart() {
      gameState = 'ready';
      score = 0;
      level = 1;
      time = 30;
      errors = 0;
      round = 0;
      updateUI();
      document.getElementById('displayText').textContent = '';
      document.getElementById('userInput').value = '';
      document.getElementById('userInput').disabled = true;
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('dessert-buttons').style.display = 'none';
    }

    // 更新UI
    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
      document.getElementById('errors').textContent = errors;
      document.getElementById('time').textContent = time;
    }

    // 页面加载时初始化游戏
    window.onload = function () {
      initGame();
    };
  </script>
