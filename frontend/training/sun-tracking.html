<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>追太阳</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background-image: url('../images/ground9.png');
        background-size: cover;
        background-position: center;
        color: #333;
        overflow-y: auto;
        min-height: 100vh;
      }

      .container {
        max-width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
        position: relative;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #ffc107;
        font-size: 2.5em;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(255, 193, 7, 0.8);
      }

      .header p {
        font-size: 1.1em;
        color: #ffc107;
        text-shadow: 0 0 10px rgba(255, 193, 7, 0.8);
      }

      .header {
        margin-bottom: 50px;
      }

      .game-area {
        background-image: url('../images/ground3.png');
        background-size: cover;
        background-position: center;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 0 30px rgba(64, 166, 255, 0.3);
        margin-bottom: 30px;
        border: 1px solid rgba(85, 176, 255, 0.3);
      }

      .difficulty-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
      }

      .difficulty-btn {
        padding: 10px 40px;
        border: 2px solid #ffc107;
        background-color: rgba(255, 255, 255, 0.8);
        color: #ffc107;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s;
      }

      .difficulty-btn:hover {
        background-color: rgba(255, 193, 7, 0.2);
      }

      .difficulty-btn.active {
        background-color: #ffc107;
        color: white;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 10px;
        font-size: 20px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 5px 15px;
        border-radius: 20px;
        color: #ffc107;
        font-weight: bold;
      }

      .tracking-area {
        width: 500px;
        height: 500px;
        background-color: transparent;
        border: 5px solid rgba(255, 255, 255);
        border-radius: 15px;
        position: relative;
        margin-bottom: 20px;
        cursor: crosshair;
      }

      .target {
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-image: url('../images/sun.png');
        background-size: cover;
        display: none;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 26px;
        transition: all 0.3s ease;
      }

      .target.visible {
        display: flex;
      }

      .target.active {
        transform: scale(1.2);
      }

      .controls {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }

      .btn-start {
        background-color: #ffc107;
        color: white;
        border: none;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
      }

      .btn-start:hover {
        background-color: #ffb300;
        transform: scale(1.1);
      }

      .btn-start.hidden {
        display: none;
      }

      .feedback {
        text-align: center;
        margin-bottom: 10px;
        padding: 5px 15px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        font-size: 14px;
        color: #ffb300;
        font-weight: bold;
      }

      .literature {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-size: 12px;
        color: #666;
        background-color: rgba(255, 255, 255, 0.9);
        padding: 10px;
        border-radius: 5px;
      }

      /* 游戏结束弹窗 */
      .game-over-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(60, 30, 10, 0.55);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(6px);
      }

      .game-over-modal.show {
        display: flex;
      }

      .game-over-content {
        background: linear-gradient(175deg, #fff8e1 0%, #ffecb3 30%, #ffe082 60%, #ffc107 100%);
        padding: 40px 40px 34px;
        border-radius: 26px;
        text-align: center;
        box-shadow:
          0 0 50px rgba(255, 193, 7, 0.3),
          0 12px 44px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        max-width: 460px;
        width: 90%;
        animation: modalSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 2px solid rgba(255, 179, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      .game-over-content::before {
        content: '';
        position: absolute;
        top: -60px;
        right: -40px;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, rgba(255, 193, 7, 0.35) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      }

      .game-over-content::after {
        content: '';
        position: absolute;
        bottom: -30px;
        left: -30px;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, rgba(255, 152, 0, 0.2) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      }

      @keyframes modalSlideIn {
        from {
          transform: translateY(-40px) scale(0.9);
          opacity: 0;
        }

        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .game-over-content h2 {
        color: #e65100;
        font-size: 30px;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      }

      .game-over-subtitle {
        color: #bf8f00;
        font-size: 14px;
        margin-bottom: 26px;
        position: relative;
        z-index: 1;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-bottom: 28px;
        position: relative;
        z-index: 1;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.65);
        padding: 16px 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 179, 0, 0.3);
        backdrop-filter: blur(4px);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .stat-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(255, 152, 0, 0.2);
      }

      .stat-icon {
        font-size: 20px;
        margin-bottom: 4px;
      }

      .stat-label {
        color: #bf8f00;
        font-size: 13px;
        margin-bottom: 6px;
        font-weight: bold;
      }

      .stat-value {
        color: #e65100;
        font-size: 28px;
        font-weight: bold;
      }

      .stat-value.highlight {
        color: #ff6d00;
        font-size: 34px;
        text-shadow: 0 0 8px rgba(255, 152, 0, 0.3);
      }

      .modal-divider {
        width: 40px;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(255, 152, 0, 0.5), transparent);
        border-radius: 2px;
        margin: 0 auto 24px;
        position: relative;
        z-index: 1;
      }

      .modal-buttons {
        display: flex;
        gap: 14px;
        justify-content: center;
        position: relative;
        z-index: 1;
      }

      .modal-btn {
        padding: 13px 30px;
        border: none;
        border-radius: 28px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        position: relative;
        overflow: hidden;
      }

      .modal-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        transition: left 0.5s ease;
      }

      .modal-btn:hover::after {
        left: 100%;
      }

      .modal-btn.restart {
        background: linear-gradient(135deg, #ffb300 0%, #ff8f00 100%);
        color: #fff;
        box-shadow: 0 4px 18px rgba(255, 143, 0, 0.4);
      }

      .modal-btn.restart:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 8px 28px rgba(255, 143, 0, 0.55);
      }

      .modal-btn.back {
        background: rgba(255, 255, 255, 0.7);
        color: #bf8f00;
        border: 1.5px solid rgba(255, 179, 0, 0.4);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }

      .modal-btn.back:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 6px 20px rgba(255, 152, 0, 0.25);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div style="position: absolute; top: 20px; left: 20px; z-index: 1000">
        <button
          onclick="window.location.href = '../child-home.html'"
          style="
            background: linear-gradient(135deg, #ffc107, #ffd54f);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          onmouseover="this.style.transform = 'scale(1.1) rotate(10deg)'"
          ;
          onmouseout="this.style.transform = 'scale(1) rotate(0deg)'"
        >
          ←
        </button>
      </div>

      <div class="header">
        <h1>追太阳</h1>
        <p>跟随移动的太阳，训练视觉追踪能力</p>
      </div>

      <div class="game-area">
        <div class="difficulty-selector">
          <button class="difficulty-btn active" onclick="setDifficulty('easy')">简单</button>
          <button class="difficulty-btn" onclick="setDifficulty('medium')">中等</button>
          <button class="difficulty-btn" onclick="setDifficulty('hard')">困难</button>
        </div>

        <div class="stats">
          <div>得分: <span id="score">0</span></div>
          <div>时间: <span id="time">0</span>s</div>
          <div>错误: <span id="errors">0</span></div>
        </div>

        <div class="feedback" id="feedback">准备就绪，点击开始按钮</div>

        <div class="tracking-area" id="tracking-area">
          <div class="target" id="target">1</div>
          <div class="controls" id="start-controls">
            <button class="btn-start" id="start-btn" onclick="startGame()">开始</button>
          </div>
        </div>
      </div>

      <div class="literature">
        <p>文献依据：眼动追踪训练研究</p>
      </div>
    </div>

    <script src="../floating-ball.js"></script>
    <script src="../api/vision-uploader.js"></script>
    <script src="../utils.js"></script>
    <script>
      let isGameStarted = false;
      let score = 0;
      let timeElapsed = 0;
      let errorCount = 0;
      let currentTarget = 1;
      let maxTargets = 20;
      let startTime = 0;
      let gameInterval;
      let targetInterval;
      let currentDifficulty = 'easy';
      let totalClick = 0;
      let reactionTimes = [];
      let targetAppearTime = 0;

      // [scoring-system] Session created in startGame() so vision data
      // covers the full gameplay period, not just the end-of-game API window.
      let gameSessionId = null;

      const difficultyConfig = {
        easy: { speed: 1500, size: 80 },
        medium: { speed: 1200, size: 70 },
        hard: { speed: 900, size: 60 },
      };

      const target = document.getElementById('target');
      const trackingArea = document.getElementById('tracking-area');
      const feedback = document.getElementById('feedback');

      function setDifficulty(difficulty) {
        currentDifficulty = difficulty;
        document.querySelectorAll('.difficulty-btn').forEach((btn) => {
          btn.classList.remove('active');
        });
        event.target.classList.add('active');
        resetGame();
      }

      function resetGame() {
        isGameStarted = false;
        score = 0;
        timeElapsed = 0;
        errorCount = 0;
        currentTarget = 1;
        totalClick = 0;
        reactionTimes = [];
        targetAppearTime = 0;

        document.getElementById('score').textContent = score;
        document.getElementById('time').textContent = timeElapsed;
        document.getElementById('errors').textContent = errorCount;

        target.classList.remove('visible');
        target.classList.remove('active');
        document.getElementById('start-btn').classList.remove('hidden');
        feedback.textContent = '准备就绪，点击开始按钮';

        clearInterval(gameInterval);
        clearInterval(targetInterval);
      }

      function startGame() {
        if (isGameStarted) return;

        resetGame();
        isGameStarted = true;
        startTime = Date.now();

        document.getElementById('start-btn').classList.add('hidden');
        target.classList.add('visible');
        feedback.textContent = '游戏开始！点击目标';

        moveTarget();

        gameInterval = setInterval(() => {
          timeElapsed = Math.floor((Date.now() - startTime) / 1000);
          document.getElementById('time').textContent = timeElapsed;
        }, 1000);

        const config = difficultyConfig[currentDifficulty];
        target.style.width = config.size + 'px';
        target.style.height = config.size + 'px';

        targetInterval = setInterval(() => {
          if (isGameStarted && currentTarget <= maxTargets) {
            errorCount++;
            document.getElementById('errors').textContent = errorCount;
            currentTarget++;
            if (currentTarget > maxTargets) {
              endGame();
            } else {
              moveTarget();
            }
          }
        }, config.speed);

        // [scoring-system] Create training session at game start so that
        // vision data captured during gameplay is associated with this session.
        const _isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const _baseUrl = _isLocal ? 'http://localhost:5000' : window.location.origin;
        const _userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
        const _childId =
          (typeof UserStateUtil !== 'undefined' ? UserStateUtil.getCurrentChildId() : null) ||
          _userInfo?.currentChildId ||
          1;

        fetch(`${_baseUrl}/api/training/session/start`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
          },
          body: JSON.stringify({
            child_id: _childId,
            game_type: 'sun-tracking',
            device_id: 'web',
          }),
        })
          .then((r) => r.json())
          .then((res) => {
            if (res.success) {
              gameSessionId = res.data.session_id;
              if (typeof visionUploader !== 'undefined') {
                visionUploader.start(gameSessionId);
              }
            }
          })
          .catch((err) => {
            console.warn('Failed to create session at game start:', err);
          });
      }

      function moveTarget() {
        const config = difficultyConfig[currentDifficulty];
        const maxX = 500 - config.size;
        const maxY = 500 - config.size;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        target.style.left = x + 'px';
        target.style.top = y + 'px';
        target.textContent = currentTarget;

        // 记录目标出现时间
        targetAppearTime = Date.now();
      }

      function handleTargetClick() {
        if (!isGameStarted) return;

        // 计算反应时间
        const clickTime = Date.now();
        const reactionTime = clickTime - targetAppearTime;
        reactionTimes.push(reactionTime);
        totalClick++;

        score++;
        currentTarget++;
        document.getElementById('score').textContent = score;

        if (currentTarget > maxTargets) {
          endGame();
        } else {
          moveTarget();
          clearInterval(targetInterval);
          const config = difficultyConfig[currentDifficulty];
          targetInterval = setInterval(() => {
            if (isGameStarted && currentTarget <= maxTargets) {
              errorCount++;
              totalClick++;
              document.getElementById('errors').textContent = errorCount;
              currentTarget++;
              if (currentTarget > maxTargets) {
                endGame();
              } else {
                moveTarget();
              }
            }
          }, config.speed);
        }
      }

      function endGame() {
        isGameStarted = false;
        clearInterval(gameInterval);
        clearInterval(targetInterval);

        // 统计游戏使用时间
        try {
          if (typeof GameTimeUtil !== 'undefined') {
            GameTimeUtil.endGame('sun-tracking');
          }
        } catch (e) {
          console.log('GameTimeUtil 未定义，跳过');
        }

        target.classList.remove('visible');
        document.getElementById('start-btn').classList.remove('hidden');
        feedback.textContent = `游戏结束！得分: ${score}, 错误: ${errorCount}`;

        const trainingData = {
          training_type: 'sun-tracking',
          difficulty: currentDifficulty,
          score: score,
          errors: errorCount,
          time: timeElapsed,
        };

        if (typeof StorageUtil !== 'undefined') {
          StorageUtil.setItem('training_sun_tracking', trainingData);
        }

        if (typeof MedalUtil !== 'undefined') {
          MedalUtil.recordGameProgress('game5', currentDifficulty);
        }

        // 上传数据到后端
        uploadTrainingData();

        // 显示游戏结束弹窗
        showGameOverModal();
      }

      function calculateTrackingScore() {
        // 计算平均反应时间
        const meanRt =
          reactionTimes.length > 0 ? reactionTimes.reduce((sum, rt) => sum + rt, 0) / reactionTimes.length : 1000;

        // 计算各项指标
        const acc = totalClick > 0 ? score / totalClick : 0;
        // 放宽时间评分：使用更平滑的曲线，超时120秒才扣到0分
        const timeOvertime = timeElapsed - 60;
        const speed = Math.max(0, 1 / (1 + timeOvertime / 90)); // 使用指数衰减，90秒后降到约50%
        const rtScore = Math.max(0, 1 - meanRt / 1000);

        // MediaPipe 指标（暂时使用默认值，后续可从实际数据获取）
        const headStable = 0.8; // 头部稳定性
        const faceStable = 0.8; // 面部稳定性

        // 计算最终得分
        const scoreValue = (acc * 0.35 + rtScore * 0.25 + speed * 0.2 + headStable * 0.12 + faceStable * 0.08) * 100;

        return Math.max(0, Math.min(100, Math.round(scoreValue)));
      }

      function showGameOverModal() {
        try {
          // 计算视觉追踪得分
          const finalScore = calculateTrackingScore();

          // 计算平均反应时间
          const meanRt =
            reactionTimes.length > 0
              ? Math.round(reactionTimes.reduce((sum, rt) => sum + rt, 0) / reactionTimes.length)
              : 0;

          console.log(
            '游戏结束 - 得分:',
            finalScore,
            '用时:',
            timeElapsed,
            '正确:',
            score,
            '错误:',
            errorCount,
            '总点击:',
            totalClick,
            '平均反应时间:',
            meanRt,
            'ms',
          );

          // 填充数据
          document.getElementById('modal-score').textContent = finalScore;
          document.getElementById('modal-time').textContent = timeElapsed + 's';
          document.getElementById('modal-correct').textContent = score;
          document.getElementById('modal-errors').textContent = errorCount;

          // 显示弹窗
          const modal = document.getElementById('gameOverModal');
          modal.classList.add('show');
          modal.style.display = 'flex';
        } catch (e) {
          console.error('显示游戏结束弹窗失败:', e);
        }
      }

      function restartGame() {
        // 隐藏弹窗
        const modal = document.getElementById('gameOverModal');
        modal.classList.remove('show');
        modal.style.display = 'none';

        // 重新开始游戏
        resetGame();
        setTimeout(() => {
          startGame();
        }, 500);
      }

      function backToStart() {
        // 隐藏弹窗
        const modal = document.getElementById('gameOverModal');
        modal.classList.remove('show');
        modal.style.display = 'none';

        // 返回到开始状态
        resetGame();
      }

      function uploadTrainingData() {
        try {
          // [scoring-system] Upload game data + end session.
          // Session was created in startGame(); use gameSessionId directly.
          const _uploadAndEnd = () => {
            const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
            const childId =
              typeof UserStateUtil !== 'undefined'
                ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
                : 1;

            // 计算视觉追踪得分
            const finalScore = calculateTrackingScore();

            // 计算平均反应时间
            const meanRt =
              reactionTimes.length > 0
                ? Math.round(reactionTimes.reduce((sum, rt) => sum + rt, 0) / reactionTimes.length)
                : 0;

            // 检测环境，设置API地址
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

            if (typeof visionUploader !== 'undefined') {
              visionUploader.stop();
            }

            // 上传游戏数据
            fetch(`${baseUrl}/api/training/game-data`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
              },
              body: JSON.stringify({
                session_id: gameSessionId,
                request_id: Date.now().toString(),
                timestamp: new Date().toISOString(),
                event_type: 'game_complete',
                score: finalScore,
                accuracy: (score / totalClick) * 100,
                level: currentDifficulty,
                time: timeElapsed,
                correct: score,
                error: errorCount,
                total_target: maxTargets,
                total_step: totalClick,
                total_click: totalClick,
                mean_rt: meanRt,
              }),
            })
              .then((response) => response.json())
              .then((result) => {
                if (result.success) {
                  console.log('游戏数据上传成功');

                  // 清除能力评估页面的缓存
                  const cacheKey = `child_data_${childId}`;
                  localStorage.removeItem(cacheKey);
                  console.log('已清除能力评估缓存:', cacheKey);

                  // 结束训练会话
                  const accuracy = totalClick > 0 ? (score / totalClick) * 100 : 0;
                  return fetch(`${baseUrl}/api/training/session/end`, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
                    },
                    body: JSON.stringify({
                      session_id: gameSessionId,
                      final_score: finalScore,
                      total_accuracy: accuracy,
                      duration: timeElapsed,
                    }),
                  });
                } else {
                  throw new Error(result.message || '上传游戏数据失败');
                }
              })
              .then((response) => response.json())
              .then((result) => {
                console.log('会话结束响应数据:', result);
                if (result.success) {
                  console.log('训练数据上传完成');

                  // 保存训练时间到 localStorage，用于今日训练页面显示
                  const today = new Date().toISOString().split('T')[0];
                  const trainingData = JSON.parse(localStorage.getItem('trainingData') || '{}');

                  if (!trainingData[today]) {
                    trainingData[today] = { totalTime: 0 };
                  }

                  // 累加游戏时间（秒）
                  trainingData[today].totalTime += timeElapsed;
                  localStorage.setItem('trainingData', JSON.stringify(trainingData));
                  console.log('训练时间已保存到 localStorage');

                  // 使用后端计算的综合评分（融合视觉数据 + 游戏权重 + 难度）
                  var backendScore = null;
                  var backendLevel = null;
                  if (result.data && result.data.summary) {
                    backendScore = Math.round(result.data.summary.final_score);
                    backendLevel = result.data.summary.performance_level;
                  }
                  if (backendScore !== null) {
                    var scoreEl = document.getElementById('modal-score');
                    if (scoreEl) {
                      scoreEl.textContent = backendScore + '分 (' + (backendLevel || '') + ')';
                    }
                  }
                }
              })
              .catch((error) => {
                console.error('上传训练数据失败:', error);
              });
          };

          if (gameSessionId) {
            _uploadAndEnd();
          } else {
            // [scoring-system] Fallback: session not ready from startGame().
            console.warn('Session not ready from startGame, creating inline');
            const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
            const childId =
              typeof UserStateUtil !== 'undefined'
                ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
                : 1;
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

            fetch(`${baseUrl}/api/training/session/start`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
              },
              body: JSON.stringify({
                child_id: childId,
                game_type: 'sun-tracking',
                device_id: 'web',
              }),
            })
              .then((r) => r.json())
              .then((res) => {
                if (res.success) {
                  gameSessionId = res.data.session_id;
                  // 先上传缓冲的视觉数据，再提交游戏数据
                  var flushDone = Promise.resolve();
                  if (typeof visionUploader !== 'undefined') {
                    flushDone = visionUploader.start(gameSessionId) || Promise.resolve();
                  }
                  flushDone.then(function () {
                    _uploadAndEnd();
                  });
                }
              });
          }
        } catch (e) {
          console.error('uploadTrainingData 错误:', e);
        }
      }

      target.addEventListener('click', handleTargetClick);
    </script>

    <!-- 游戏结束弹窗 -->
    <div class="game-over-modal" id="gameOverModal">
      <div class="game-over-content">
        <h2>☀️ 追到了太阳！</h2>
        <div class="game-over-subtitle">你成功捕获了所有的太阳光点</div>
        <div class="modal-divider"></div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-icon">🏆</div>
            <div class="stat-label">得分</div>
            <div class="stat-value highlight" id="modal-score">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">⏱️</div>
            <div class="stat-label">用时</div>
            <div class="stat-value" id="modal-time">0s</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">✅</div>
            <div class="stat-label">正确</div>
            <div class="stat-value" id="modal-correct">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">❌</div>
            <div class="stat-label">错误</div>
            <div class="stat-value" id="modal-errors">0</div>
          </div>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn restart" onclick="restartGame()">🔄 再来一局</button>
          <button class="modal-btn back" onclick="backToStart()">🏠 返回开始</button>
        </div>
      </div>
    </div>

    <script src="../attention-loader.js"></script>
  </body>
</html>
