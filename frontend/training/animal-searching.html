<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森林动物追踪战</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background-image: url('../images/ground14.png');
        background-size: cover;
        background-position: center;
        color: #333;
        min-height: 100vh;
      }

      .container {
        max-width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
        position: relative;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #fff;
        font-size: 2.5em;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(99, 255, 154, 0.8);
      }

      .header p {
        font-size: 1.1em;
        color: #fff;
        text-shadow: 0 0 10px rgba(118, 255, 125, 0.8);
      }

      .game-area {
        background-image: url('../images/ground13.png');
        background-size: cover;
        background-position: center;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 0 30px #244237;
        margin-bottom: 30px;
        border: 1px solid #244237;
      }

      .game-info {
        display: flex;
        justify-content: space-around;
        margin-bottom: 10px;
        font-size: 20px;
        background: rgba(255, 255, 255, 0.5);
        padding: 5px 15px;
        border-radius: 20px;
        color: #223b32;
        font-weight: bold;
      }

      .canvas-container {
        width: 500px;
        height: 500px;
        background: transparent;
        border: 5px solid #7dad86;
        border-radius: 15px;
        position: relative;
        margin: 0 auto 20px;
      }

      canvas {
        background: transparent;
        display: block;
        transform: translateZ(0);
        will-change: transform;
      }

      .instructions {
        background: rgba(255, 255, 255, 0.5);
        border-radius: 15px;
        padding: 20px 30px;
        margin-bottom: 10px;
      }

      .instructions h2 {
        color: #0f6204;
        margin-bottom: 10px;
      }

      .difficulty-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
      }

      .difficulty-btn {
        padding: 10px 40px;
        border: 2px solid #d9e679;
        background: rgba(255, 255, 255, 0.8);
        color: #d9e679;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s;
      }

      .difficulty-btn:hover {
        background: rgba(255, 193, 7, 0.2);
      }

      .difficulty-btn.active {
        background: #d9e679;
        color: #223b32;
      }

      .controls {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }

      .btn {
        background: linear-gradient(135deg, #b9d372, #a9ccb4);
        color: white;
        border: none;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        font-size: 30px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 0 20px #a9ccb4;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 30px #a9ccb4;
      }

      .btn.hidden {
        display: none;
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background: linear-gradient(135deg, #fff, #065514);
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .back-btn:hover {
        transform: scale(1.1) rotate(10deg);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes cosmosBloom {
        0% {
          transform: scale(0.8) translateY(40px);
          opacity: 0;
        }

        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      @keyframes revealUp {
        0% {
          transform: translateY(12px);
          opacity: 0;
        }

        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes forestBounce {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.6;
        }

        50% {
          transform: translateY(-8px);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <button class="back-btn" onclick="window.location.href = getTrainingReturnUrl()">←</button>
      <div class="header">
        <h1>森林动物追踪战</h1>
        <p>化身森林小侦探，找到发光的小动物，锻炼注意力分配能力！</p>
      </div>
      <div class="game-area">
        <div class="instructions">
          <h2>游戏说明</h2>
          <ul>
            <li>游戏开始时，会有几只发光的小动物短暂闪烁，请记住它们的位置</li>
            <li>移动停止后，点击你记住的发光小动物</li>
          </ul>
        </div>
        <div class="difficulty-selector">
          <button class="difficulty-btn active" id="easyBtn">简单</button>
          <button class="difficulty-btn" id="mediumBtn">中等</button>
          <button class="difficulty-btn" id="hardBtn">困难</button>
        </div>
        <div class="game-info">
          <div>轮次: <span id="roundText">1</span>/3</div>
          <div>得分: <span id="scoreText">0</span></div>
          <div>错误: <span id="errorText">0</span></div>
        </div>
        <div class="canvas-container">
          <canvas id="gameCanvas" width="500" height="500"></canvas>
          <div class="controls">
            <button class="btn" id="startBtn">开始</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const startBtn = document.getElementById('startBtn');
      const roundText = document.getElementById('roundText');
      const scoreText = document.getElementById('scoreText');
      const errorText = document.getElementById('errorText');
      const easyBtn = document.getElementById('easyBtn');
      const mediumBtn = document.getElementById('mediumBtn');
      const hardBtn = document.getElementById('hardBtn');

      // 动物图片路径
      const animalImages = [
        '../images/angela.png',
        '../images/squrriel.png',
        '../images/rabbit.png',
        '../images/hedgehog.png',
        '../images/fox.png',
        '../images/bird.png',
      ];

      // 预加载图片
      const loadedImages = {};
      animalImages.forEach((src) => {
        const img = new Image();
        img.src = src;
        loadedImages[src] = img;
      });

      // 预渲染发光光晕（避免每帧创建 RadialGradient）
      const glowSize = 75;
      const glowCanvas = document.createElement('canvas');
      glowCanvas.width = glowSize * 2;
      glowCanvas.height = glowSize * 2;
      const glowCtx = glowCanvas.getContext('2d');
      const glowGrad = glowCtx.createRadialGradient(
        glowSize,
        glowSize,
        glowSize * 0.25,
        glowSize,
        glowSize,
        glowSize * 0.85,
      );
      glowGrad.addColorStop(0, 'rgba(255, 235, 59, 0.5)');
      glowGrad.addColorStop(0.5, 'rgba(255, 193, 7, 0.22)');
      glowGrad.addColorStop(1, 'rgba(255, 193, 7, 0)');
      glowCtx.fillStyle = glowGrad;
      glowCtx.beginPath();
      glowCtx.arc(glowSize, glowSize, glowSize * 0.85, 0, Math.PI * 2);
      glowCtx.fill();

      let objects = [];
      let score = 0;
      let errors = 0;
      let round = 1;
      const maxRound = 3;
      let gameState = 'ready'; // ready → highlighting → moving → selecting
      let animationId = null;
      let moveEndTime;
      let totalClick = 0;
      let reactionTimes = [];
      let selectionStartTime = 0;
      let gameStartTime = 0;
      let lastFrameTime = 0;

      // 森林主题音效
      var soundCtx = null;
      function getSCtx() {
        if (!soundCtx) soundCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (soundCtx.state === 'suspended') soundCtx.resume();
        return soundCtx;
      }
      function playChirp() {
        var ctx = getSCtx(),
          now = ctx.currentTime;
        var osc = ctx.createOscillator(),
          gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1600, now + 0.05);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      function playThud() {
        var ctx = getSCtx(),
          now = ctx.currentTime;
        var osc = ctx.createOscillator(),
          gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      // [scoring-system] Session created in startGame() so vision data
      // covers the full gameplay period, not just the end-of-game API window.
      let gameSessionId = null;

      // 难度
      let difficulty = { count: 8, target: 1, speed: 3, moveTime: 3000, highTime: 1500 };
      let currentDifficultyKey = 'easy';
      function setDifficulty(diff) {
        currentDifficultyKey = diff;
        if (diff === 'easy') difficulty = { count: 8, target: 1, speed: 3, moveTime: 3000, highTime: 1500 };
        if (diff === 'medium') difficulty = { count: 10, target: 2, speed: 4, moveTime: 3500, highTime: 1200 };
        if (diff === 'hard') difficulty = { count: 12, target: 3, speed: 4.5, moveTime: 4000, highTime: 1000 };
        document.querySelectorAll('.difficulty-btn').forEach((b) => b.classList.remove('active'));
        if (diff === 'easy') easyBtn.classList.add('active');
        if (diff === 'medium') mediumBtn.classList.add('active');
        if (diff === 'hard') hardBtn.classList.add('active');
        reset();
      }
      easyBtn.onclick = () => setDifficulty('easy');
      mediumBtn.onclick = () => setDifficulty('medium');
      hardBtn.onclick = () => setDifficulty('hard');

      // 清空动画
      function clearAnim() {
        if (animationId) cancelAnimationFrame(animationId);
      }

      // 重置
      function reset() {
        clearAnim();
        gameState = 'ready';
        objects = [];
        score = 0;
        errors = 0;
        round = 1;
        totalClick = 0;
        reactionTimes = [];
        selectionStartTime = 0;
        updateUI();
        startBtn.classList.remove('hidden');
        ctx.clearRect(0, 0, 500, 500);
      }

      // 检查两个物体是否重叠（真实距离 + 缓冲间距）
      function checkOverlap(obj1, obj2) {
        const dx = obj1.x + obj1.size / 2 - (obj2.x + obj2.size / 2);
        const dy = obj1.y + obj1.size / 2 - (obj2.y + obj2.size / 2);
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < obj1.size + 20;
      }

      // 创建物体
      function createObjects() {
        objects = [];
        let total = difficulty.count;
        let targetCount = difficulty.target;
        const spawnMax = 425;
        for (let i = 0; i < total; i++) {
          let attempts = 0;
          let validPosition = false;
          let newObj = null;

          while (!validPosition && attempts < 200) {
            const randomImage = animalImages[Math.floor(Math.random() * animalImages.length)];
            const angle = Math.random() * Math.PI * 2;
            newObj = {
              x: Math.random() * spawnMax,
              y: Math.random() * spawnMax,
              size: 75,
              vx: Math.cos(angle) * difficulty.speed,
              vy: Math.sin(angle) * difficulty.speed,
              isTarget: i < targetCount,
              selected: false,
              image: randomImage,
              animation: 0,
            };

            validPosition = true;
            for (let j = 0; j < objects.length; j++) {
              if (checkOverlap(newObj, objects[j])) {
                validPosition = false;
                break;
              }
            }
            attempts++;
          }

          if (newObj) {
            objects.push(newObj);
          }
        }
      }

      // 移动停止后分离所有重叠的动物
      function separateOverlapping() {
        for (let iter = 0; iter < 10; iter++) {
          let hasOverlap = false;
          for (let i = 0; i < objects.length; i++) {
            for (let j = i + 1; j < objects.length; j++) {
              const a = objects[i];
              const b = objects[j];
              const cxA = a.x + a.size / 2;
              const cyA = a.y + a.size / 2;
              const cxB = b.x + b.size / 2;
              const cyB = b.y + b.size / 2;
              const dx = cxA - cxB;
              const dy = cyA - cyB;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const minDist = a.size + 10;
              if (dist < minDist && dist > 0) {
                hasOverlap = true;
                const nx = dx / dist;
                const ny = dy / dist;
                const push = (minDist - dist) / 2;
                a.x += nx * push;
                a.y += ny * push;
                b.x -= nx * push;
                b.y -= ny * push;
                a.x = Math.max(0, Math.min(500 - a.size, a.x));
                a.y = Math.max(0, Math.min(500 - a.size, a.y));
                b.x = Math.max(0, Math.min(500 - b.size, b.x));
                b.y = Math.max(0, Math.min(500 - b.size, b.y));
              }
            }
          }
          if (!hasOverlap) break;
        }
      }

      // 开始
      startBtn.onclick = () => {
        if (gameState !== 'ready') return;
        clearAnim();
        gameState = 'highlighting';
        startBtn.classList.add('hidden');
        gameStartTime = Date.now();
        lastFrameTime = 0;
        createObjects();
        animate();
        setTimeout(() => {
          gameState = 'moving';
          moveEndTime = Date.now() + difficulty.moveTime;
        }, difficulty.highTime);

        // [scoring-system] Create training session at game start so that
        // vision data captured during gameplay is associated with this session.
        const _isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const _baseUrl = _isLocal ? 'http://localhost:5000' : window.location.origin;
        const _userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
        const _childId =
          (typeof UserStateUtil !== 'undefined' ? UserStateUtil.getCurrentChildId() : null) ||
          _userInfo?.currentChildId ||
          1;

        fetch(`${_baseUrl}/api/training/session/start`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
          },
          body: JSON.stringify({
            child_id: _childId,
            game_type: 'animal-searching',
            device_id: 'web',
          }),
        })
          .then((r) => r.json())
          .then((res) => {
            if (res.success) {
              gameSessionId = res.data.session_id;
              if (typeof visionUploader !== 'undefined') {
                visionUploader.start(gameSessionId);
              }
            }
          })
          .catch((err) => {
            console.warn('Failed to create session at game start:', err);
          });
      };

      function animate(timestamp) {
        if (!lastFrameTime) lastFrameTime = timestamp;
        const rawDt = (timestamp - lastFrameTime) / 1000;
        const dt = Math.min(rawDt, 0.1);
        lastFrameTime = timestamp;

        ctx.clearRect(0, 0, 500, 500);

        if (gameState === 'moving') {
          const scale = dt * 60;
          objects.forEach((o) => {
            o.x += o.vx * scale;
            o.y += o.vy * scale;
            if (o.x < 0) {
              o.x = 0;
              o.vx *= -1;
            }
            if (o.x + o.size > 500) {
              o.x = 500 - o.size;
              o.vx *= -1;
            }
            if (o.y < 0) {
              o.y = 0;
              o.vy *= -1;
            }
            if (o.y + o.size > 500) {
              o.y = 500 - o.size;
              o.vy *= -1;
            }
          });
          if (Date.now() > moveEndTime) {
            separateOverlapping();
            gameState = 'selecting';
            selectionStartTime = Date.now();
          }
        }

        // 绘制
        objects.forEach((o) => {
          const rx = Math.round(o.x);
          const ry = Math.round(o.y);

          // 发光效果 - 使用预渲染光晕图片
          if (o.isTarget && gameState === 'highlighting') {
            ctx.save();
            ctx.shadowColor = '#FFC107';
            ctx.shadowBlur = 35;
            ctx.drawImage(glowCanvas, rx - glowSize / 2, ry - glowSize / 2, glowSize * 2, glowSize * 2);
            ctx.restore();
            ctx.drawImage(glowCanvas, rx - glowSize / 2, ry - glowSize / 2, glowSize * 2, glowSize * 2);
          }

          // 绘制动物图片
          const img = loadedImages[o.image];
          if (img) {
            ctx.drawImage(img, rx, ry, o.size, o.size);
          }

          // 动画效果 - 闪光效果
          if (o.animation > 0) {
            o.animation += 0.2;
            if (o.animation > 1) {
              o.animation = 0;
            }
            const animationRadius = o.size / 2 + o.animation * 30;
            const alpha = 1 - o.animation;
            ctx.strokeStyle = o.isTarget ? `rgba(27, 94, 32, ${alpha})` : `rgba(244, 67, 54, ${alpha})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(o.x + o.size / 2, o.y + o.size / 2, animationRadius, 0, Math.PI * 2);
            ctx.stroke();

            const centerRadius = o.animation * 15;
            ctx.fillStyle = o.isTarget ? `rgba(27, 94, 32, ${alpha})` : `rgba(244, 67, 54, ${alpha})`;
            ctx.beginPath();
            ctx.arc(o.x + o.size / 2, o.y + o.size / 2, centerRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          // 选中效果
          if (o.selected) {
            ctx.strokeStyle = o.isTarget ? '#1B5E20' : '#F44336';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(o.x + o.size / 2, o.y + o.size / 2, o.size / 2, 0, Math.PI * 2);
            ctx.stroke();
          }
        });

        animationId = requestAnimationFrame(animate);
      }

      // 点击（绝对有效）
      canvas.onclick = (e) => {
        if (gameState !== 'selecting') return;

        // 计算反应时间
        const clickTime = Date.now();
        const reactionTime = clickTime - selectionStartTime;
        reactionTimes.push(reactionTime);
        totalClick++;

        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // 遍历物体，找到第一个被点击的物体
        for (let i = 0; i < objects.length; i++) {
          const o = objects[i];
          if (o.selected) continue;
          if (mx >= o.x && mx <= o.x + o.size && my >= o.y && my <= o.y + o.size) {
            o.selected = true;
            o.animation = 1; // 开始动画
            if (o.isTarget) {
              score++;
              playChirp();
            } else {
              errors++;
              playThud();
            }
            updateUI();
            // 找到一个物体后立即返回，确保一次只点击一个物体
            break;
          }
        }

        // 检查完成
        const allDone = objects.filter((o) => o.isTarget).every((o) => o.selected);
        if (allDone) {
          // 延迟进入下一轮，让最后一个绿色方框有时间显示
          setTimeout(nextRound, 500);
        }
      };

      // 下一轮（完全干净）
      function nextRound() {
        clearAnim();
        round++;
        if (round > maxRound) {
          // 显示游戏结束弹窗
          showGameOverModal();
          return;
        }
        updateUI();
        // 新一轮
        setTimeout(() => {
          gameState = 'highlighting';
          lastFrameTime = 0;
          createObjects();
          animate();
          setTimeout(() => {
            gameState = 'moving';
            moveEndTime = Date.now() + difficulty.moveTime;
          }, difficulty.highTime);
        }, 600);
      }

      function calculateTrackingScore() {
        // 计算平均反应时间
        const meanRt =
          reactionTimes.length > 0 ? reactionTimes.reduce((sum, rt) => sum + rt, 0) / reactionTimes.length : 1000;

        // 计算各项指标
        const acc = totalClick > 0 ? score / totalClick : 0;
        // 放宽时间评分：使用更平滑的曲线，超时120秒才扣到0分
        const timeOvertime = (Date.now() - gameStartTime) / 1000 - 60;
        const speed = Math.max(0, 1 / (1 + timeOvertime / 90)); // 使用指数衰减
        const rtScore = Math.max(0, 1 - meanRt / 1000);

        // MediaPipe 指标（暂时使用默认值，后续可从实际数据获取）
        const headStable = 0.8; // 头部稳定性
        const faceStable = 0.8; // 面部稳定性

        // 计算最终得分
        const scoreValue = (acc * 0.35 + rtScore * 0.25 + speed * 0.2 + headStable * 0.12 + faceStable * 0.08) * 100;

        return Math.max(0, Math.min(100, Math.round(scoreValue)));
      }

      function showGameOverModal() {
        const finalScoreValue = calculateTrackingScore();
        const totalTime = Math.floor((Date.now() - gameStartTime) / 1000);

        const scoreDetails = {
          hits: {
            name: '找到',
            score: score,
            color: '#2e7d32',
          },
          errors: {
            name: '误点',
            score: errors,
            color: '#c62828',
          },
          time: {
            name: '用时',
            score: totalTime + 's',
            color: '#ef6c00',
          },
        };

        const message = '你的评分为：' + finalScoreValue + '分';

        // 统计游戏使用时间
        try {
          if (typeof GameTimeUtil !== 'undefined') {
            GameTimeUtil.endGame('animal-searching');
          }
        } catch (e) {
          console.log('GameTimeUtil 未定义，跳过');
        }

        if (typeof MedalUtil !== 'undefined') {
          MedalUtil.recordGameProgress('game6', currentDifficultyKey);
        }

        uploadTrainingData();

        const modal = document.createElement('div');

      function uploadTrainingData() {
        try {
          // [scoring-system] Upload game data + end session.
          // Session was created in startGame(); use gameSessionId directly.
          const _uploadAndEnd = () => {
            const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
            const childId =
              typeof UserStateUtil !== 'undefined'
                ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
                : 1;

            // 计算视觉追踪得分
            const finalScore = calculateTrackingScore();

            // 计算平均反应时间
            const meanRt =
              reactionTimes.length > 0
                ? Math.round(reactionTimes.reduce((sum, rt) => sum + rt, 0) / reactionTimes.length)
                : 0;

            // 检测环境，设置API地址
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

            if (typeof visionUploader !== 'undefined') {
              visionUploader.stop();
            }

            // 上传游戏数据
            fetch(`${baseUrl}/api/training/game-data`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
              },
              body: JSON.stringify({
                session_id: gameSessionId,
                request_id: Date.now().toString(),
                timestamp: new Date().toISOString(),
                event_type: 'game_complete',
                score: finalScore,
                accuracy: (score / totalClick) * 100,
                level: difficulty.level || 1,
                time: Math.floor((Date.now() - gameStartTime) / 1000),
                correct: score,
                error: errors,
                total_target: score,
                total_step: totalClick,
                total_click: totalClick,
                mean_rt: meanRt,
              }),
            })
              .then((response) => response.json())
              .then((result) => {
                if (result.success) {
                  console.log('游戏数据上传成功');

                  // 清除能力评估页面的缓存
                  const cacheKey = `child_data_${childId}`;
                  localStorage.removeItem(cacheKey);
                  console.log('已清除能力评估缓存:', cacheKey);

                  // 结束训练会话
                  return fetch(`${baseUrl}/api/training/session/end`, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
                    },
                    body: JSON.stringify({
                      session_id: gameSessionId,
                      final_score: finalScore,
                      total_accuracy: (score / totalClick) * 100,
                      duration: Math.floor((Date.now() - gameStartTime) / 1000),
                    }),
                  });
                } else {
                  throw new Error(result.message || '上传游戏数据失败');
                }
              })
              .then((response) => response.json())
              .then((result) => {
                console.log('会话结束响应数据:', result);
                if (result.success) {
                  console.log('训练数据上传完成');

                  // 保存训练时间到 localStorage，用于今日训练页面显示
                  const today = new Date().toISOString().split('T')[0];
                  const trainingData = JSON.parse(localStorage.getItem('trainingData') || '{}');

                  if (!trainingData[today]) {
                    trainingData[today] = { totalTime: 0 };
                  }

                  // 累加游戏时间（秒）
                  const gameTime = Math.floor((Date.now() - gameStartTime) / 1000);
                  trainingData[today].totalTime += gameTime;
                  localStorage.setItem('trainingData', JSON.stringify(trainingData));
                  console.log('训练时间已保存到 localStorage');

                  // 使用后端计算的综合评分（融合视觉数据 + 游戏权重 + 难度）
                  var backendScore = null;
                  var backendLevel = null;
                  if (result.data && result.data.summary) {
                    backendScore = Math.round(result.data.summary.final_score);
                    backendLevel = result.data.summary.performance_level;
                  }
                }
              })
              .catch((error) => {
                console.error('上传训练数据失败:', error);
              });
          };

          if (gameSessionId) {
            _uploadAndEnd();
          } else {
            // [scoring-system] Fallback: session not ready from startGame().
            console.warn('Session not ready from startGame, creating inline');
            const userInfo = typeof UserStateUtil !== 'undefined' ? UserStateUtil.getUserInfo() : null;
            const childId =
              typeof UserStateUtil !== 'undefined'
                ? UserStateUtil.getCurrentChildId() || userInfo?.currentChildId || 1
                : 1;
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const baseUrl = isLocal ? 'http://localhost:5000' : window.location.origin;

            fetch(`${baseUrl}/api/training/session/start`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('auth_token')}`,
              },
              body: JSON.stringify({
                child_id: childId,
                game_type: 'animal-searching',
                device_id: 'web',
              }),
            })
              .then((r) => r.json())
              .then((res) => {
                if (res.success) {
                  gameSessionId = res.data.session_id;
                  // 先上传缓冲的视觉数据，再提交游戏数据
                  var flushDone = Promise.resolve();
                  if (typeof visionUploader !== 'undefined') {
                    flushDone = visionUploader.start(gameSessionId) || Promise.resolve();
                  }
                  flushDone.then(function () {
                    _uploadAndEnd();
                  });
                }
              });
          }
        } catch (e) {
          console.error('uploadTrainingData 错误:', e);
        }
      }

      // 重置游戏
      function resetGame() {
        reset();
      }

      function updateUI() {
        roundText.textContent = round;
        scoreText.textContent = score;
        errorText.textContent = errors;
      }

      reset();
    </script>
