[tool.ruff]
# 目标 Python 版本
target-version = "py312"

# 行宽
line-length = 120

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (未使用的导入、变量等)
    "I",     # isort (导入排序)
    "N",     # pep8-naming (命名规范)
    "UP",    # pyupgrade (现代 Python 语法)
    "B",     # flake8-bugbear (常见 bug)
    "SIM",   # flake8-simplify (简化代码)
]

# 忽略的规则
ignore = [
    "E501",  # 行过长（由 line-length 控制，formatter 自动处理）
    "B008",  # 允许在函数参数中直接调用（Flask 路由装饰器需要）
]

[tool.ruff.lint.per-file-ignores]
# 数据库回滚/关闭时的 bare except 是标准安全模式
"database/db.py" = ["E722", "SIM105"]
# ALTER TABLE IF NOT EXISTS 模式在 SQLite 中需要 try-except-pass
"database/models.py" = ["SIM105"]
# 迁移脚本中的变量可能用于调试
"database/migrate.py" = ["F841"]
# 数据采集中的异常处理需要容错
"backend/analytics/data_collector.py" = ["E722"]
# app.py 需要在导入后打印调试信息
"backend/app.py" = ["E402"]

[tool.ruff.lint.isort]
# 导入排序：已知第一方包
known-first-party = ["database", "backend", "middleware", "utils", "modules", "analytics", "ai"]

[tool.ruff.format]
# 格式化设置
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
